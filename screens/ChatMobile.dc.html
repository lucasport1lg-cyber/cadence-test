<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Discussion — Golf</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<x-dc>
<helmet>
<style>
:root{
  --on-accent:#0d0d0d;
  --bg:#0d0d0d;
  --surface:#1a1a19;
  --surface-2:#242422;
  --border:rgba(255,255,255,0.10);
  --text:#ffffff;
  --text-2:#c3c2b7;
  --text-3:#898781;
  --accent:#3987e5;
  --status-good:#0ca30c;
  --status-critical:#e66767;
  --driving:#3987e5;
  --fers:#d95926;
  --petitjeu:#199e70;
  --putting:#c98500;
  --mental:#d55181;
  --physique:#008300;
}
[data-theme="light"]{
  --bg:#f7f3ea;
  --surface:#fffffd;
  --surface-2:#ece4d3;
  --border:rgba(27,29,34,0.12);
  --text:#1b1d22;
  --text-2:#45433c;
  --text-3:#6e6758;
  --grid:#e4dccb;
  --accent:#1e5c3f;
  --on-accent:#ffffff;
  --status-good:#0a7f0a;
  --status-critical:#c23a3a;
  --driving:#2b73cc;
  --fers:#c24e1f;
  --petitjeu:#0f7c86;
  --putting:#9a6700;
  --mental:#b83d6b;
  --physique:#6a4bb8;
}
[data-theme="light"][data-palette="classique"]{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#ebe9e3; --border:rgba(13,13,13,0.12);
  --text:#141413; --text-2:#44433e; --text-3:#6b6962; --grid:#e2e0d9; --accent:#2b73cc;
}
[data-theme="light"][data-palette="fairway"]{
  --bg:#f2f5f1; --surface:#ffffff; --surface-2:#e2e9e0; --border:rgba(18,32,26,0.12);
  --text:#12201a; --text-2:#3c4a42; --text-3:#5e6c65; --grid:#dce4da; --accent:#1e7a4f; --petitjeu:#0f7c86; --physique:#6a4bb8;
}
[data-theme="light"][data-palette="rose"]{
  --bg:#fbf4f6; --surface:#ffffff; --surface-2:#f3e4ea; --border:rgba(42,22,32,0.12);
  --text:#2a1620; --text-2:#553f49; --text-3:#7a5e6a; --grid:#eedde4; --accent:#c2477a; --mental:#7a4fc4;
}
[data-theme="light"][data-palette="lisible"]{
  --bg:#ffffff; --surface:#f4f4f6; --surface-2:#e6e6eb; --border:rgba(0,0,0,0.18);
  --text:#000000; --text-2:#2e2e31; --text-3:#5e5e63; --grid:#dddde2; --accent:#0a5fcc;
}
[data-theme="dark"][data-palette="clubhouse"]{
  --bg:#0f1411; --surface:#171d19; --surface-2:#212923; --border:rgba(242,239,231,0.10);
  --text:#f2efe7; --text-2:#c9c3b4; --text-3:#8e8878; --grid:#28302a;
  --accent:#4fbf86; --on-accent:#0f1411; --driving:#4fc3f7; --petitjeu:#2bb3c0; --physique:#9b7be0;
}
[data-theme="dark"][data-palette="fairway"]{
  --bg:#0b1510; --surface:#13201a; --surface-2:#1c2c24; --border:rgba(238,243,238,0.10);
  --text:#eef3ee; --text-2:#bfcbc3; --text-3:#85948b; --grid:#22342a;
  --accent:#3fbf7f; --on-accent:#0b1510; --petitjeu:#2bb3c0; --physique:#9b7be0;
}
[data-theme="dark"][data-palette="rose"]{
  --bg:#1a0f15; --surface:#24161e; --surface-2:#2f1e28; --border:rgba(247,237,241,0.10);
  --text:#f7edf1; --text-2:#d6c2cb; --text-3:#a18c96; --grid:#3a2632;
  --accent:#f07aa8; --on-accent:#1a0f15; --mental:#a98bf0;
}
[data-theme="dark"][data-palette="lisible"]{
  --bg:#000000; --surface:#111114; --surface-2:#222228; --border:rgba(255,255,255,0.22);
  --text:#ffffff; --text-2:#e6e6ea; --text-3:#b4b4bb; --grid:#2a2a30;
  --accent:#5aa2ff; --on-accent:#000000;
}
[data-theme][data-palette][data-cvd="rg"]{
  --status-good:#56b4e9; --status-critical:#e69f00;
  --driving:#56b4e9; --fers:#e69f00; --petitjeu:#009e73; --putting:#f0e442; --mental:#cc79a7; --physique:#bdbdbd;
}
[data-theme="light"][data-palette][data-cvd="rg"]{
  --status-good:#0072b2; --status-critical:#b85000;
  --driving:#0072b2; --fers:#d55e00; --petitjeu:#007a5a; --putting:#a88f00; --mental:#b0588d; --physique:#6b6b6b;
}
[data-theme][data-palette][data-cvd="by"]{
  --status-good:#3dd6c4; --status-critical:#ff5c8a;
  --driving:#90caf9; --fers:#ff7043; --petitjeu:#00897b; --putting:#f48fb1; --mental:#ba68c8; --physique:#e0e0e0;
}
[data-theme="light"][data-palette][data-cvd="by"]{
  --status-good:#00796b; --status-critical:#c2185b;
  --driving:#1e5fa8; --fers:#d84315; --petitjeu:#00695c; --putting:#ad1457; --mental:#7b1fa2; --physique:#616161;
}
*{box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
</style>
</helmet>

<div data-theme="{{ theme }}" data-palette="{{ palette }}" data-cvd="{{ cvd }}" style="width: 390px; height: 844px; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; position: relative; {{ cvdStyle }}">

  <!-- Header -->
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 16px 20px 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface);">
    <a href="{{ backHref }}" aria-label="Retour aux messages" style="width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); color: var(--text); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
    </a>
    <div style="width: 40px; height: 40px; border-radius: 50%; background: color-mix(in srgb, var(--{{ who.color }}) 18%, transparent); color: var(--{{ who.color }}); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0;">{{ who.ini }}</div>
    <div style="flex-grow: 1;">
      <div style="font-size: 15px; font-weight: 600;">{{ who.name }}</div>
      <div style="font-size: 12px; color: var(--text-3);">{{ who.sub }}</div>
    </div>
  </div>

  <!-- Messages -->
  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 12px 16px; display: flex; flex-direction: column; gap: 8px;">
    <div style="align-self: center; font-size: 12px; color: var(--text-3); background: var(--surface); padding: 4px 10px; border-radius: 999px; margin-bottom: 4px;">Aujourd'hui</div>
    <sc-for list="{{ msgs }}" as="m" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; align-items: {{ m.align }}; gap: 3px;">
        <sc-if value="{{ m.isText }}" hint-placeholder-val="{{ true }}">
          <div style="max-width: 78%; padding: 10px 14px; border-radius: {{ m.radius }}; background: {{ m.bg }}; color: {{ m.color }}; font-size: 14px; line-height: 1.4;">{{ m.text }}</div>
        </sc-if>
        <sc-if value="{{ m.isGame }}" hint-placeholder-val="{{ false }}">
          <a href="PartieDetail.dc.html" style="width: 250px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); overflow: hidden; display: block;">
            <div style="padding: 12px 14px; display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <div style="font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em;">Partie · Compétition</div>
                <div style="font-size: 14px; font-weight: 600; margin-top: 4px;">Coupe de la rentrée</div>
                <div style="font-size: 12px; color: var(--text-3); margin-top: 2px;">[Nom du golf] · 14 sept.</div>
              </div>
              <div style="text-align: right;"><div class="display" style="font-size: 26px; font-weight: 600; line-height: 1;">76</div><div style="font-size: 12px; color: var(--text-2); margin-top: 2px;">+4</div></div>
            </div>
            <div style="padding: 10px 14px; border-top: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--accent);">Voir la partie ›</div>
          </a>
        </sc-if>
        <sc-if value="{{ m.isNote }}" hint-placeholder-val="{{ false }}">
          <div style="width: 270px; border-radius: 16px; background: var(--surface); border: 1px solid var(--mental); overflow: hidden;">
            <div style="padding: 12px 14px;">
              <div style="font-size: 12px; font-weight: 600; color: var(--mental); text-transform: uppercase; letter-spacing: 0.05em;">{{ m.noteTitle }}</div>
              <div style="font-size: 14px; line-height: 1.45; margin-top: 6px;">{{ m.text }}</div>
            </div>
            <a href="{{ m.progHref }}" onClick="{{ m.progGo }}" style="display: block; padding: 10px 14px; border-top: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--mental);">{{ m.progLbl }}</a>
          </div>
        </sc-if>
        <sc-if value="{{ m.isStats }}" hint-placeholder-val="{{ false }}">
          <div style="width: 250px; border-radius: 16px; background: var(--surface); border: 1px solid var(--accent); padding: 12px 14px;">
            <div style="font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em;">Mes stats · 7 derniers jours</div>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px; text-align: center;">
              <div><div class="display" style="font-size: 18px; font-weight: 600; color: var(--accent);">14.2</div><div style="font-size: 12px; color: var(--text-3);">Index</div></div>
              <div><div class="display" style="font-size: 18px; font-weight: 600;">5h00</div><div style="font-size: 12px; color: var(--text-3);">Entraînement</div></div>
              <div><div class="display" style="font-size: 18px; font-weight: 600;">32.1</div><div style="font-size: 12px; color: var(--text-3);">Putts / tour</div></div>
            </div>
          </div>
        </sc-if>
        <span style="font-size: 12px; color: var(--text-3); padding: 0 4px;">{{ m.time }}</span>
      </div>
    </sc-for>
  </div>

  <!-- Share options -->
  <sc-if value="{{ attachOpen }}" hint-placeholder-val="{{ false }}">
    <div style="flex-shrink: 0; margin: 0 16px 8px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 6px; display: flex; flex-direction: column;">
      <button onClick="{{ shareGame }}" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: var(--text); font-size: 14px; cursor: pointer; text-align: left;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4l10 4-10 4"/><path d="M4 21h6"/></svg>
        Partager une partie
      </button>
      <button onClick="{{ shareStats }}" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: var(--text); font-size: 14px; cursor: pointer; text-align: left;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
        Partager mes stats
      </button>
      <button onClick="{{ sharePhoto }}" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: var(--text); font-size: 14px; cursor: pointer; text-align: left;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>
        Photo ou vidéo
      </button>
    </div>
  </sc-if>

  <!-- Composer -->
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px 28px 16px; border-top: 1px solid var(--border); background: var(--surface);">
    <button aria-label="Partager une partie, des stats ou une photo" onClick="{{ toggleAttach }}" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--surface-2); color: var(--text); display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <input type="text" value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}" placeholder="Écrire un message" aria-label="Écrire un message" style="flex-grow: 1; min-width: 0; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px; outline: none;">
    <button aria-label="Envoyer" onClick="{{ send }}" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </button>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Couleurs du mode daltonien, posées directement sur l'écran
  // Taille du texte : l'écran entier est agrandi, en gardant le format du téléphone
  zoomStyle() {
    let z = 'md';
    try { z = window.localStorage.getItem('cadence.textSize') || 'md'; } catch (e) {}
    const f = { sm: 0.9, md: 1, lg: 1.1, xl: 1.2 }[z] || 1;
    if (f === 1) return '';
    return ' zoom: ' + f + '; width: ' + (390 / f).toFixed(2) + 'px; height: ' + (844 / f).toFixed(2) + 'px;';
  }
  cvdVars() {
    const c = this.cvdNow();
    if (c !== 'rg' && c !== 'by') return '';
    const light = this.themeNow() === 'light';
    const sets = {
      rg: light
        ? ['#0072b2', '#b85000', '#0072b2', '#d55e00', '#007a5a', '#a88f00', '#b0588d', '#6b6b6b']
        : ['#56b4e9', '#e69f00', '#56b4e9', '#e69f00', '#009e73', '#f0e442', '#cc79a7', '#bdbdbd'],
      by: light
        ? ['#00796b', '#c2185b', '#1e5fa8', '#d84315', '#00695c', '#ad1457', '#7b1fa2', '#616161']
        : ['#3dd6c4', '#ff5c8a', '#90caf9', '#ff7043', '#00897b', '#f48fb1', '#ba68c8', '#e0e0e0']
    }[c];
    const names = ['status-good', 'status-critical', 'driving', 'fers', 'petitjeu', 'putting', 'mental', 'physique'];
    return names.map((n, i) => '--' + n + ': ' + sets[i] + ';').join(' ');
  }
  cvdNow() {
    let c = 'off';
    try { c = window.localStorage.getItem('cadence.cvd') || 'off'; } catch (e) {}
    return c;
  }
  paletteNow() {
    let p = 'clubhouse';
    try { p = window.localStorage.getItem('cadence.palette') || 'clubhouse'; } catch (e) {}
    return p;
  }
  // Thème : sombre par défaut, clair ou automatique (suit le téléphone) selon les Paramètres
  themeNow() {
    let t = 'dark';
    try { t = window.localStorage.getItem('cadence.theme') || 'dark'; } catch (e) {}
    if (t === 'auto') { try { t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { t = 'dark'; } }
    return t;
  }
  componentDidMount() {
    // Suit le thème choisi dans les Paramètres, même si l'écran est déjà ouvert
    this._lastTheme = this.themeNow() + this.paletteNow() + this.cvdNow() + this.zoomStyle();
    this._themeTimer = setInterval(() => { const t = this.themeNow() + this.paletteNow() + this.cvdNow() + this.zoomStyle(); if (t !== this._lastTheme) { this._lastTheme = t; this.forceUpdate(); } }, 400);
  }
  componentWillUnmount() {
    clearInterval(this._themeTimer);
  }
  // Contact choisi dans Social (mémorisé au moment du clic)
  chatWho() {
    let id = 'thomas';
    try { id = window.localStorage.getItem('cadence.chat') || 'thomas'; } catch (e) {}
    const t = (me, text, time) => ({ me: me, type: 'text', text: text, time: time });
    if (id.indexOf('st:') === 0) {
      const S = { lea: ['LM', 'Léa M.', 'mental'], hugo: ['HT', 'Hugo T.', 'fers'], emma: ['EK', 'Emma K.', 'petitjeu'], sophie: ['SD', 'Sophie D.', 'driving'], nathan: ['NR', 'Nathan R.', 'putting'], jade: ['JB', 'Jade B.', 'physique'] };
      const sid = id.slice(3), e = S[sid] || S.lea;
      let saved = []; try { saved = JSON.parse(window.localStorage.getItem('cadence.notes.' + sid) || '[]') || []; } catch (err) {}
      const note = (text, when) => ({ me: true, type: 'note', title: 'Note de cours · ' + when, text: text, prog: 'Putting en 3 semaines', toCoach: true, time: when });
      return { ini: e[0], name: e[1], sub: 'Élève', color: e[2], back: 'CoachEleveMobile.dc.html', msgs: [note('Bonne régularité sur les putts de 1 à 2 m. Prochaine étape : le dosage sur les putts longs.', '15 sept.'), t(false, 'Merci ! Je fais l’échelle de dosage demain.', '15 sept.')].concat(saved.slice().reverse().map((n) => note(n.text, n.when))) };
    }
    const all = {
      thomas: { ini: 'TB', name: 'Thomas B.', sub: 'Index 11.8 · ami', color: 'fers', msgs: [t(false, 'Salut ! Tu joues ce week-end ?', '09:05'), t(true, 'Oui, samedi matin. Regarde ma dernière partie :', '09:08'), { me: true, type: 'game', time: '09:08' }, t(false, 'Joli ! Ton putting a bien progressé.', '09:10'), t(false, 'Partie samedi ?', '09:12')] },
      julie: { ini: 'JM', name: 'Julie M.', sub: 'Index 18.5 · amie', color: 'petitjeu', msgs: [t(false, 'J’ai joué 82 hier à [Autre golf] !', 'Hier'), t(false, 'Le 7 m’a coûté un triple, sinon c’était mon meilleur score.', 'Hier'), t(true, 'Bravo ! Tu progresses vite.', 'Hier')] },
      marc: { ini: 'MD', name: 'Marc D.', sub: 'Index 9.2 · ami', color: 'putting', msgs: [t(false, 'Sur les putts courts, garde la tête immobile jusqu’au bruit de la balle dans le trou.', 'Lun.'), t(false, 'Et regarde un point précis sur la balle.', 'Lun.'), t(true, 'Merci pour les conseils putting', 'Lun.')] },
      sarah: { ini: 'SL', name: 'Sarah L.', sub: 'Index 16.4 · amie', color: 'accent', msgs: [t(false, 'Merci d’avoir accepté ! On se fait un 9 trous ?', 'À l’instant')] },
      coach: { ini: 'CR', name: 'Camille R.', sub: 'Coach', color: 'mental', msgs: [{ me: false, type: 'note', title: 'Note de cours · jeu. 17 sept.', text: 'Routine validée sur les putts courts. Cette semaine : échelle de dosage de 6 à 10 m, 3 séries.', prog: 'Putting en 3 semaines', time: 'Jeu.' }, t(false, 'J’ai vu ta séance putting de mardi : très régulier.', '10:20'), t(false, 'Bravo pour le 76 ! On travaille le putting jeudi ?', '10:24')] }
    };
    return all[id] || all.thomas;
  }
  renderVals() {
    const s = this.state || {};
    const who = this.chatWho();
    const base = who.msgs;
    const all = base.concat(s.sent || []);
    const push = (m) => this.setState({ sent: (s.sent || []).concat([Object.assign({ me: true, time: 'Maintenant' }, m)]), attachOpen: false, draft: m.type === 'text' ? '' : (s.draft || '') });
    const send = () => { const t = (s.draft || '').trim(); if (t) push({ type: 'text', text: t }); };
    return {
      theme: this.themeNow(),
      palette: this.paletteNow(),
      cvd: this.cvdNow(),
      cvdStyle: this.cvdVars() + this.zoomStyle(),
      who: who,
      backHref: who.back || 'SocialMobile.dc.html',
      msgs: all.map((m) => ({
        text: m.text || '', time: m.time,
        isText: m.type === 'text', isGame: m.type === 'game', isStats: m.type === 'stats', isNote: m.type === 'note',
        noteTitle: m.title || '', progLbl: ('Voir le programme · ' + (m.prog || '') + ' ›'),
        progHref: m.toCoach ? 'CoachProgrammeMobile.dc.html' : 'SeancesMobile.dc.html',
        progGo: () => { try { if (!m.toCoach) window.localStorage.setItem('cadence.seancesGo', JSON.stringify({ tab: 'train', cp: true })); } catch (e) {} },
        align: m.me ? 'flex-end' : 'flex-start',
        bg: m.me ? 'var(--accent)' : 'var(--surface-2)',
        color: m.me ? 'var(--on-accent)' : 'var(--text)',
        radius: m.me ? '18px 18px 4px 18px' : '18px 18px 18px 4px'
      })),
      draft: s.draft || '',
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') send(); },
      send: send,
      attachOpen: !!s.attachOpen,
      toggleAttach: () => this.setState({ attachOpen: !s.attachOpen }),
      shareGame: () => push({ type: 'game' }),
      shareStats: () => push({ type: 'stats' }),
      sharePhoto: () => push({ type: 'text', text: '📷 Photo de mon swing au practice' })
    };
  }
}
